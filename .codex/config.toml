model = "gpt-5.6-sol"  # based of artificial analytics' intelligence/cost of task benchmark
model_reasoning_effort = "medium"  # https://artificialanalysis.ai/?cost=intelligence-vs-cost-per-task
service_tier = "default"
approval_policy = "on-request"
approvals_reviewer = "guardian_subagent"
sandbox_mode = "workspace-write"


[features]
hooks = true
guardian_approval = true
memories = true
terminal_resize_reflow = true
external_migration = true
prevent_idle_sleep = true
goals = true
remote_control = true
